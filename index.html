<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --color-bg: #0f0f0f;
  --color-surface: #1a1a1a;
  --color-surface-2: #222;
  --color-surface-3: #2a2a2a;
  --color-border: rgba(255,255,255,0.08);
  --color-text: #f0f0f0;
  --color-text-muted: #888;
  --color-text-faint: #555;

  --seg: #3b82f6;   --seg-bg: rgba(59,130,246,0.12);
  --ter: #22c55e;   --ter-bg: rgba(34,197,94,0.12);
  --qua: #a855f7;   --qua-bg: rgba(168,85,247,0.12);
  --qui: #f59e0b;   --qui-bg: rgba(245,158,11,0.12);
  --sex: #06b6d4;   --sex-bg: rgba(6,182,212,0.12);
  --off: #6b7280;   --off-bg: rgba(107,114,128,0.1);

  --radius: 14px;
  --radius-sm: 8px;
  --font-body: 'Inter', sans-serif;
  --transition: 180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="light"] {
  --color-bg: #f4f4f5;
  --color-surface: #fff;
  --color-surface-2: #f9f9f9;
  --color-surface-3: #efefef;
  --color-border: rgba(0,0,0,0.08);
  --color-text: #111;
  --color-text-muted: #666;
  --color-text-faint: #aaa;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:none;text-size-adjust:none;}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);min-height:100dvh;overscroll-behavior:none;}

/* HEADER */
.app-header{
  position:sticky;top:0;z-index:50;
  background:var(--color-bg);
  border-bottom:1px solid var(--color-border);
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.app-header h1{font-size:1.1rem;font-weight:700;letter-spacing:-0.3px;}
.app-header p{font-size:.72rem;color:var(--color-text-muted);margin-top:1px;}
.theme-btn{
  width:36px;height:36px;border:1px solid var(--color-border);border-radius:50%;
  background:var(--color-surface);display:flex;align-items:center;justify-content:center;
  font-size:1rem;cursor:pointer;flex-shrink:0;
  transition:background var(--transition);
}
.theme-btn:active{transform:scale(.92);}

/* DAY TABS */
.day-tabs{
  display:flex;gap:6px;overflow-x:auto;padding:12px 14px 8px;
  scrollbar-width:none;position:sticky;top:65px;z-index:40;
  background:var(--color-bg);border-bottom:1px solid var(--color-border);
}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{
  flex:0 0 auto;padding:7px 13px;border-radius:50px;
  font-size:.76rem;font-weight:600;cursor:pointer;
  border:1.5px solid var(--color-border);background:var(--color-surface);
  color:var(--color-text-muted);transition:all var(--transition);
  -webkit-tap-highlight-color:transparent;
}
.day-tab.active{color:#fff;border-color:transparent;}
.day-tab[data-d="seg"].active{background:var(--seg);}
.day-tab[data-d="ter"].active{background:var(--ter);}
.day-tab[data-d="qua"].active{background:var(--qua);}
.day-tab[data-d="qui"].active{background:var(--qui);}
.day-tab[data-d="sex"].active{background:var(--sex);}
.day-tab[data-d="sab"].active,.day-tab[data-d="dom"].active{background:var(--off);}

/* CONTENT */
.content{padding:12px 14px 100px;}
.day-panel{display:none;}
.day-panel.active{display:block;}

/* DAY HERO */
.day-hero{
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;
}
.day-hero-icon{font-size:2rem;flex-shrink:0;}
.day-hero h2{font-size:1rem;font-weight:700;}
.day-hero .sub{font-size:.75rem;opacity:.8;margin-top:3px;}

/* PROGRESS */
.prog-wrap{margin-bottom:14px;}
.prog-label{display:flex;justify-content:space-between;font-size:.72rem;color:var(--color-text-muted);margin-bottom:5px;}
.prog-track{height:5px;background:var(--color-surface-3);border-radius:50px;overflow:hidden;}
.prog-fill{height:100%;border-radius:50px;transition:width .4s ease;}

/* EXERCISE CARD */
.ex-card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius);margin-bottom:8px;overflow:hidden;
}
.ex-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ex-badge{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;
}
.ex-name{flex:1;font-size:.9rem;font-weight:600;line-height:1.3;}
.ex-chevron{font-size:.8rem;color:var(--color-text-faint);transition:transform var(--transition);}
.ex-card.open .ex-chevron{transform:rotate(180deg);}

.ex-pills{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap;}
.pill{
  background:var(--color-surface-3);border-radius:50px;
  padding:4px 10px;font-size:.72rem;font-weight:600;color:var(--color-text-muted);
}

.ex-body{display:none;border-top:1px solid var(--color-border);padding:14px;}
.ex-card.open .ex-body{display:block;}

.obs-box{
  background:var(--color-surface-2);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:.78rem;color:var(--color-text-muted);line-height:1.5;
  margin-bottom:14px;
}

/* CARGA */
.section-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--color-text-faint);margin-bottom:8px;}
.carga-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.carga-input{
  flex:1;max-width:110px;padding:9px 12px;border:1.5px solid var(--color-border);
  border-radius:var(--radius-sm);background:var(--color-surface-2);
  color:var(--color-text);font-size:1rem;font-weight:700;text-align:center;outline:none;
  -webkit-appearance:none;
}
.carga-input:focus{border-color:var(--day-color,#3b82f6);}
.save-btn{
  padding:9px 14px;border:none;border-radius:var(--radius-sm);
  background:var(--day-color,#3b82f6);color:#fff;font-size:.8rem;font-weight:700;
  cursor:pointer;transition:opacity var(--transition);
  -webkit-tap-highlight-color:transparent;
}
.save-btn:active{opacity:.75;}
.saved-note{font-size:.7rem;color:var(--ter);margin-left:4px;display:none;}
.saved-note.show{display:inline;}

/* SETS */
.set-dots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.set-dot{
  width:40px;height:40px;border-radius:50%;border:1.5px solid var(--color-border);
  background:var(--color-surface-2);cursor:pointer;font-size:.78rem;font-weight:700;
  color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.set-dot.done{color:#fff;}
.set-dot:active{transform:scale(.88);}

/* REST TIMER */
.rest-btn{
  width:100%;padding:10px;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);
  background:var(--color-surface-2);color:var(--color-text-muted);
  font-size:.82rem;font-weight:600;cursor:pointer;transition:all var(--transition);
  -webkit-tap-highlight-color:transparent;
}
.rest-btn:active{opacity:.75;}
.rest-btn.running{border-color:var(--ter);color:var(--ter);}
.timer-val{
  display:none;text-align:center;margin-top:8px;
  font-size:2rem;font-weight:800;color:var(--ter);letter-spacing:-1px;
}
.timer-val.show{display:block;}
.timer-done{display:none;text-align:center;margin-top:8px;font-size:.9rem;font-weight:700;color:var(--ter);}
.timer-done.show{display:block;}

/* INFO CARD */
.info-card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius);padding:16px;margin-bottom:10px;
}
.info-card h3{font-size:.9rem;font-weight:700;margin-bottom:8px;}
.info-card ul{padding-left:16px;}
.info-card li{font-size:.82rem;color:var(--color-text-muted);margin-bottom:5px;line-height:1.45;}
.info-card .tip-label{
  font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--qui);margin-bottom:4px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--color-bg);border-top:1px solid var(--color-border);
  display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));
  z-index:50;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;cursor:pointer;padding:4px 16px;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn span:first-child{font-size:1.25rem;}
.nav-btn span:last-child{font-size:.62rem;color:var(--color-text-faint);}

/* WEEK OVERVIEW */
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.week-card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius);padding:12px 14px;cursor:pointer;
  transition:border-color var(--transition);-webkit-tap-highlight-color:transparent;
}
.week-card:active{opacity:.75;}
.week-card .wc-day{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.week-card .wc-title{font-size:.83rem;font-weight:600;line-height:1.3;}
.week-card .wc-sub{font-size:.72rem;color:var(--color-text-muted);margin-top:2px;}

/* TABS */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

  /* DIET */
  .diet-macro-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .diet-macro-title{font-size:.95rem;font-weight:700;margin-bottom:2px;}
  .diet-macro-sub{font-size:.72rem;color:var(--color-text-muted);margin-bottom:14px;}
  .macro-bars{display:flex;flex-direction:column;gap:10px;}
  .macro-bar-item{}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--color-text-muted);margin-bottom:4px;}
  .macro-val{font-weight:700;}
  .macro-val.prot{color:#3b82f6;}
  .macro-val.carb{color:#22c55e;}
  .macro-val.fat{color:#f59e0b;}
  .macro-track{height:6px;background:var(--color-surface-3);border-radius:50px;overflow:hidden;}
  .macro-fill{height:100%;border-radius:50px;}
  .prot-fill{background:#3b82f6;}
  .carb-fill{background:#22c55e;}
  .fat-fill{background:#f59e0b;}

  .diet-day-sel{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;margin-bottom:4px;}
  .diet-day-sel::-webkit-scrollbar{display:none;}
  .diet-day-btn{flex:0 0 auto;padding:7px 13px;border-radius:50px;font-size:.76rem;font-weight:600;cursor:pointer;border:1.5px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);transition:all var(--transition);-webkit-tap-highlight-color:transparent;}
  .diet-day-btn.active{background:#3b82f6;color:#fff;border-color:transparent;}

  .meal-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:14px;margin-bottom:8px;}
  .meal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .meal-label{font-size:.88rem;font-weight:700;}
  .meal-time{font-size:.7rem;color:var(--color-text-muted);margin-top:2px;}
  .meal-prot{background:rgba(59,130,246,.12);color:#3b82f6;border-radius:50px;padding:4px 10px;font-size:.72rem;font-weight:700;white-space:nowrap;}
  .meal-desc{font-size:.82rem;color:var(--color-text-muted);line-height:1.5;}

  .diet-day-summary{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;}

  .diet-tips{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .diet-tip-title{font-size:.85rem;font-weight:700;color:var(--qui);margin-bottom:8px;}
  .diet-tips ul{padding-left:16px;}
  .diet-tips li{font-size:.78rem;color:var(--color-text-muted);margin-bottom:4px;line-height:1.4;}


  /* COMMENT & LOG */
  .comment-input{width:100%;padding:9px 12px;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface-2);color:var(--color-text);font-size:.82rem;outline:none;resize:none;font-family:var(--font-body);line-height:1.4;margin-bottom:10px;}
  .comment-input:focus{border-color:var(--day-color,#3b82f6);}
  .comment-input::placeholder{color:var(--color-text-faint);}

  /* LOG VIEW */
  .log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .log-header h2{font-size:.95rem;font-weight:700;}
  .log-clear-btn{font-size:.72rem;color:var(--color-text-faint);padding:5px 10px;border:1px solid var(--color-border);border-radius:50px;background:var(--color-surface);cursor:pointer;}
  .log-empty{text-align:center;padding:40px 20px;color:var(--color-text-muted);font-size:.85rem;}
  .log-empty-icon{font-size:2.5rem;margin-bottom:10px;}
  .log-date-group{margin-bottom:16px;}
  .log-date-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--color-text-faint);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--color-border);}
  .log-entry{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;}
  .log-entry-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .log-ex-name{font-size:.85rem;font-weight:600;flex:1;padding-right:8px;}
  .log-day-badge{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:50px;color:#fff;white-space:nowrap;flex-shrink:0;}
  .log-details{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .log-detail{font-size:.75rem;color:var(--color-text-muted);background:var(--color-surface-3);padding:3px 8px;border-radius:50px;}
  .log-comment{font-size:.78rem;color:var(--color-text-muted);font-style:italic;margin-top:4px;line-height:1.4;}
  .log-comment::before{content:"💬 ";}
  .log-export-btn{width:100%;padding:12px;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-muted);font-size:.82rem;font-weight:600;cursor:pointer;margin-top:8px;transition:all var(--transition);}
  .log-export-btn:active{opacity:.7;}

</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>💪 Meu Treino</h1>
    <p>32 anos · 173 cm · 78 kg · Avançado</p>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="Alternar tema">🌙</button>
</header>

<div class="day-tabs" id="dayTabs">
  <button class="day-tab active" data-d="seg">SEG</button>
  <button class="day-tab" data-d="ter">TER</button>
  <button class="day-tab" data-d="qua">QUA</button>
  <button class="day-tab" data-d="qui">QUI</button>
  <button class="day-tab" data-d="sex">SEX</button>
  <button class="day-tab" data-d="sab">SÁB</button>
  <button class="day-tab" data-d="dom">DOM</button>
</div>

<div class="content" id="mainContent">
  <!-- panels injected by JS -->
</div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="switchView('treino')" id="nav-treino">
    <span>🏋️</span><span>Treino</span>
  </button>
  <button class="nav-btn" onclick="switchView('log')" id="nav-log">
    <span>📋</span><span>Histórico</span>
  </button>
  <button class="nav-btn" onclick="switchView('semana')" id="nav-semana">
    <span>📅</span><span>Semana</span>
  </button>
  <button class="nav-btn" onclick="switchView('dieta')" id="nav-dieta">
    <span>🥗</span><span>Dieta</span>
  </button>
  <button class="nav-btn" onclick="switchView('dicas')" id="nav-dicas">
    <span>💡</span><span>Dicas</span>
  </button>
</div>

<script>
// ===========================
// DATA
// ===========================
const DAYS = {
  seg: {
    label:"Segunda-feira", icon:"🏋️", color:"var(--seg)", colorKey:"seg",
    title:"Peito + Tríceps", sub:"🥊 Muay Thai à noite",

    exercises:[

  qui: { label:"Quinta-feira", icon:"🧘", color:"var(--qui)", colorKey:"qui", title:"Pilates", sub:"🏊 Natação à tarde", rest:true,
    exercises:[],
    info:[
      {title:"🧘 Pilates — Mobilidade & Core",items:["Elevação pélvica (bridge)","Spine Stretch","Leg Circle","Dead Bug","Respiração diafragmática"]},
      {title:"💡 Dica para hoje",items:["Deixe 2–3h de intervalo entre pilates e natação","Foque em técnica e respiração na natação","Sessão leve — sem ir à falha"]}

  sex: {

    title:"Upper — 2º Estímulo", sub:"Ombros + Todos Superiores",
    exercises:[
      {n:"Desenvolvimento c/ halteres",    s:3, r:"8–10", d:"90s", obs:"Ombros — primário do dia"},
      {n:"Elevação lateral no cabo",       s:3, r:"12–15",d:"60s", obs:"Ombros — isolamento"},
      {n:"Supino inclinado c/ halteres",   s:3, r:"10–12",d:"60s", obs:"Peito — 2º estímulo semanal"},
      {n:"Puxada neutra",                  s:3, r:"10–12",d:"60s", obs:"Costas — 2º estímulo semanal"},
      {n:"Rosca scott ou concentrada",     s:3, r:"10–12",d:"60s", obs:"Bíceps — 2º estímulo semanal"},
      {n:"Supino fechado ou tríceps coice",s:3, r:"10–12",d:"60s", obs:"Tríceps — 2º estímulo semanal"},
    ]
  },
  sab: { label:"Sábado", icon:"🧘", color:"var(--off)", colorKey:"off", title:"Pilates", sub:"Foco: Lombar & Joelho", rest:true,
    exercises:[],
    info:[
      {title:"🧘 Pilates — Terapêutico",items:["Press Down na Chair","Agachamento funcional no Reformer","Roll Up","Swan Dive","Leg Pull Front"]},
      {title:"💡 Fechar a semana bem",items:["Alongamento global","Hidratação adequada","Priorize sono de 7–8h para começar bem na segunda"]}

function selectDay(d) {

}

function switchView(view) {

function toggleEx(eid) {
  const card = document.getElementById('excard-' + eid);

function saveCarga(eid) {
  const val = document.getElementById('carga-' + eid).value;
  const comment = (document.getElementById('comment-' + eid) || {}).value || '';
  MEM['carga_' + eid] = val;
  MEM['comment_' + eid] = comment;

  // Parse eid: "seg_0"
  const parts = eid.split('_');
  const dayKey = parts[0];
  const exIdx = parseInt(parts[1]);
  const day = DAYS[dayKey];
  const ex = day && day.exercises[exIdx];
  const seriesDone = MEM['sets_' + eid] || 0;

  if(ex && val) {
    const today = new Date();
    const dateStr = today.toLocaleDateString('pt-BR');
    LOG.unshift({
      date: dateStr,
      dayKey, dayTitle: day.title,
      exName: ex.n,
      series: seriesDone + '/' + ex.s,
      weight: val + 'kg',
      comment: comment
    });
    if(typeof renderLog === 'function') renderLog();
  }

  const note = document.getElementById('saved-' + eid);
  note.classList.add('show');
  setTimeout(() => note.classList.remove('show'), 2000);
}

function tapSet(eid, day, setIdx, totalSets, totalEx) {
  const setsKey = 'sets_' + eid;
  let done = MEM[setsKey] || 0;
  done = setIdx < done ? setIdx : setIdx + 1;
  MEM[setsKey] = done;
  // update dots
  for(let s = 0; s < totalSets; s++) {
    const dot = document.getElementById(`dot-${eid}-${s}`);
    if(s < done) {
      dot.classList.add('done');
      dot.style.background = DAYS[day].color;
      dot.style.borderColor = DAYS[day].color;
    } else {
      dot.classList.remove('done');
      dot.style.background = '';
      dot.style.borderColor = '';
    }
  }
  updateProg(day, totalEx);
}

function updateProg(day, total) {
  const exs = DAYS[day].exercises;
  let completed = 0;
  exs.forEach((ex, idx) => {
    const done = MEM['sets_' + day + '_' + idx] || 0;
    if(done >= ex.s) completed++;
  });
  const pct = Math.round(completed / total * 100);
  const fill = document.getElementById('prog-fill-' + day);
  const txt = document.getElementById('prog-txt-' + day);
  if(fill) fill.style.width = pct + '%';
  if(txt) txt.textContent = `${completed}/${total}`;
}

function startRest(eid, dStr) {
  const secs = parseInt(dStr) || 60;
  const btn = document.getElementById('rest-btn-' + eid);
  const val = document.getElementById('timer-' + eid);
  const done = document.getElementById('timer-done-' + eid);
  // cancel if running
  if(timers[eid]) {
    clearInterval(timers[eid]);
    delete timers[eid];
    btn.classList.remove('running');
    btn.textContent = `▶ Iniciar descanso — ${dStr}`;
    val.classList.remove('show');
    done.classList.remove('show');
    return;
  }
  btn.classList.add('running');
  btn.textContent = '⏹ Cancelar descanso';
  val.classList.add('show');
  done.classList.remove('show');
  let rem = secs;
  const tick = () => {
    const m = Math.floor(rem/60);
    const s = rem % 60;
    val.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(rem <= 0) {
      clearInterval(timers[eid]);
      delete timers[eid];
      btn.classList.remove('running');
      btn.textContent = `▶ Iniciar descanso — ${dStr}`;
      val.classList.remove('show');
      done.classList.add('show');
      if('vibrate' in navigator) navigator.vibrate([200,100,200]);
      return;
    }
    rem--;
  };
  tick();
  timers[eid] = setInterval(tick, 1000);
}

function renderLog() {
  const body = document.getElementById('log-body');
  if(!body) return;
  if(LOG.length === 0) {
    body.innerHTML = '<div class="log-empty"><div class="log-empty-icon">📭</div><div>Nenhum registro ainda.</div><div style="font-size:.75rem;margin-top:6px;color:var(--color-text-faint)">Salve um exercício com carga para aparecer aqui.</div></div>';
    return;
  }
  // Group by date
  const groups = {};
  LOG.forEach(e => {
    if(!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });
  const dayColors = {seg:'var(--seg)',ter:'var(--ter)',qua:'var(--qua)',qui:'var(--qui)',sex:'var(--sex)',sab:'var(--off)',dom:'var(--off)'};
  body.innerHTML = Object.keys(groups).map(date => `
    <div class="log-date-group">
      <div class="log-date-label">📅 ${date}</div>
      ${groups[date].map(e => `
        <div class="log-entry">
          <div class="log-entry-top">
            <div class="log-ex-name">${e.exName}</div>
            <div class="log-day-badge" style="background:${dayColors[e.dayKey]||'var(--off)'}">
              ${e.dayKey.toUpperCase()} · ${e.dayTitle}
            </div>
          </div>
          <div class="log-details">
            <span class="log-detail">⚖️ ${e.weight}</span>
            <span class="log-detail">📋 ${e.series} séries</span>
          </div>
          ${e.comment ? `<div class="log-comment">${e.comment}</div>` : ''}
        </div>`).join('')}
    </div>`).join('');
}

function clearLog() {
  if(LOG.length === 0) return;
  if(confirm('Limpar todo o histórico?')) { LOG.length = 0; renderLog(); }
}

function exportLog() {
  if(LOG.length === 0) { alert('Nenhum registro para exportar.'); return; }
  const header = 'Data,Dia,Treino,Exercicio,Series,Peso,Comentario';
  const rows = LOG.map(e =>
    [e.date, e.dayKey.toUpperCase(), e.dayTitle, '"'+e.exName+'"', e.series, e.weight, '"'+(e.comment||'')+'"'].join(',')
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'historico-treino.csv';
  a.click();
}

      const card = document.createElement('div');
      card.className = 'meal-card';
      card.innerHTML = `
        <div class="meal-header">
          <div>
            <div class="meal-label">${ref.label}</div>
            <div class="meal-time">${ref.time}</div>
          </div>
          <div class="meal-prot">${entry.prot}g prot.</div>
        </div>
        <div class="meal-desc">${entry.meal}</div>`;
      mealsWrap.appendChild(card);
    });
    // Total proteína do dia
    const summary = document.createElement('div');
    summary.className = 'diet-day-summary';
    summary.innerHTML = `<span>Total proteína do dia</span><span class="macro-val prot">${totalProt}g / ${mc.prot}g meta</span>`;
    mealsWrap.appendChild(summary);
  }

  // Tips card
  const tipsHtml = `
    <div class="diet-tips">
      <div class="diet-tip-title">⚡ Estratégia para treino em jejum</div>
      <ul>
        <li>Opcional pré-treino: 5–10g BCAA ou café preto puro</li>
        <li>Priorize proteína logo ao chegar em casa</li>
        <li>Dias de Muay Thai + natação: não pule o lanche da tarde!</li>
        <li>Ceia com cottage: proteína de digestão lenta pré-sono</li>
      </ul>
    </div>`;

  dieta.innerHTML = macroHtml + tipsHtml;
  dieta.appendChild(daySel);
  dieta.appendChild(mealsWrap);
  container.appendChild(dieta);
  renderMeals(activeDietDay);
}

buildDietView();

</script>
</body>
</html>
